<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="Meme Arcade — short-session crypto-parody games." />
    <title>Meme Arcade</title>
    <style>
      :root {
        color-scheme: dark;
      }
      /* The [hidden] attribute must always hide, even when an element has an
         explicit display (e.g. .arcade-rotate uses display:flex). */
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0a0a0f;
        color: #cfd6dd;
        overflow: hidden;
        overscroll-behavior: none; /* Req 7.1: no pull-to-refresh / scroll chaining */
        font-family: monospace;
        /* dynamic viewport units + safe areas (Req 7.1) */
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }
      #app {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      /* ── Selection surface ──────────────────────────────────────────────── */
      .arcade-select {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: calc(var(--safe-top) + 24px) 16px calc(var(--safe-bottom) + 24px);
      }
      .arcade-title {
        margin: 0;
        font-size: clamp(36px, 8vw, 64px);
        color: #7cf6a4;
        letter-spacing: 2px;
      }
      .arcade-sub {
        margin: 0 0 16px;
        color: #9fb0c0;
        font-size: clamp(14px, 3vw, 18px);
      }
      .arcade-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: min(420px, 92vw);
      }
      .arcade-game {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 16px 20px;
        background: #14141f;
        color: #cfd6dd;
        border: 2px solid #2a2a3a;
        border-radius: 12px;
        cursor: pointer;
        font-family: inherit;
        text-align: left;
      }
      .arcade-game:hover {
        border-color: #7cf6a4;
        background: #161f1a;
      }
      .arcade-game:focus-visible {
        outline: 3px solid #ffd866;
        outline-offset: 2px;
      }
      .arcade-game-title {
        font-size: 20px;
        font-weight: bold;
        color: #7cf6a4;
      }
      .arcade-game-tag {
        font-size: 13px;
        color: #8b95a5;
      }
      .arcade-muted-hint {
        min-height: 1em;
        color: #6a7385;
        font-size: 12px;
      }

      /* ── Playing surface ────────────────────────────────────────────────── */
      .arcade-game-shell {
        flex: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .arcade-chrome {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 6px 10px;
        background: #0d0d16;
        border-bottom: 1px solid #2a2a3a;
      }
      .arcade-back {
        background: #14141f;
        color: #cfd6dd;
        border: 1px solid #2a2a3a;
        border-radius: 6px;
        padding: 4px 10px;
        font-family: inherit;
        cursor: pointer;
      }
      .arcade-back:hover {
        border-color: #7cf6a4;
      }
      .arcade-now-playing {
        font-size: 13px;
        color: #8b95a5;
      }
      .arcade-mount {
        flex: 1 1 auto;
        position: relative;
        min-height: 0;
      }
      .arcade-mount canvas {
        display: block;
        margin: 0 auto;
      }
      .arcade-rotate {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0f;
        color: #ffd866;
        font-size: 22px;
        text-align: center;
        padding: 24px;
      }
      .arcade-loading,
      .arcade-error {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
      }
      .arcade-error pre {
        max-width: 80vw;
        overflow: auto;
        color: #ff6b6b;
        background: #160d0d;
        padding: 12px;
        border-radius: 8px;
      }

      /* ── Result screen ─────────────────────────────────────────────────── */
      .arcade-result {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: calc(var(--safe-top) + 24px) 16px calc(var(--safe-bottom) + 24px);
        max-width: 520px;
        margin: 0 auto;
        width: 100%;
      }
      .arcade-result-outcome {
        margin: 0;
        font-size: clamp(28px, 6vw, 44px);
        letter-spacing: 1px;
      }
      .arcade-win { color: #7cf6a4; }
      .arcade-loss { color: #ff6b6b; }
      .arcade-result-game {
        font-size: 14px;
        color: #8b95a5;
      }
      .arcade-result-score {
        font-size: 18px;
        color: #cfd6dd;
      }
      .arcade-result-score strong {
        font-size: 32px;
        color: #ffd866;
      }
      .arcade-result-badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      .arcade-ranked {
        background: #1a2a1f;
        color: #7cf6a4;
        border: 1px solid #2a4a3a;
      }
      .arcade-unranked {
        background: #1a1a2e;
        color: #8b95a5;
        border: 1px solid #2a2a3a;
      }
      .arcade-result-best {
        font-size: 12px;
        color: #ffd866;
      }
      .arcade-result-stats {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 4px 16px;
        margin: 0;
        font-size: 13px;
        color: #8b95a5;
      }
      .arcade-result-stats dt { display: inline; }
      .arcade-result-stats dd { display: inline; margin: 0; color: #cfd6dd; }
      .arcade-result-duration {
        font-size: 12px;
        color: #6a7385;
      }
      .arcade-share {
        width: 100%;
        background: #14141f;
        border: 1px solid #2a2a3a;
        border-radius: 10px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: flex-start;
      }
      .arcade-share-text {
        margin: 0;
        font-size: 14px;
        color: #cfd6dd;
      }
      .arcade-share-url {
        font-size: 12px;
        color: #6a7385;
        word-break: break-all;
      }
      .arcade-share-copy {
        align-self: flex-end;
        background: #1a1a2e;
        color: #7cf6a4;
        border: 1px solid #2a2a3a;
        border-radius: 6px;
        padding: 4px 12px;
        font-family: inherit;
        cursor: pointer;
        font-size: 13px;
      }
      .arcade-share-copy:hover { border-color: #7cf6a4; }
      .arcade-share-status {
        font-size: 11px;
        color: #ffd866;
      }
      .arcade-hooks {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
      }
      .arcade-hook {
        display: inline-block;
        padding: 6px 14px;
        background: #1a2a1f;
        color: #7cf6a4;
        border: 1px solid #2a4a3a;
        border-radius: 8px;
        text-decoration: none;
        font-size: 13px;
      }
      .arcade-hook:hover { border-color: #7cf6a4; }
      .arcade-result-actions {
        display: flex;
        gap: 12px;
        margin-top: 8px;
      }
      .arcade-play-again {
        background: #7cf6a4;
        color: #0a0a0f;
        border: none;
        border-radius: 8px;
        padding: 10px 20px;
        font-family: inherit;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
      }
      .arcade-play-again:hover { background: #8df6b5; }
      .arcade-back-to-arcade {
        background: #14141f;
        color: #cfd6dd;
        border: 2px solid #2a2a3a;
        border-radius: 8px;
        padding: 10px 20px;
        font-family: inherit;
        font-size: 16px;
        cursor: pointer;
      }
      .arcade-back-to-arcade:hover { border-color: #7cf6a4; }
      .arcade-result-debug {
        width: 100%;
        margin-top: 12px;
        font-size: 11px;
        color: #6a7385;
      }
      .arcade-result-debug summary {
        cursor: pointer;
        color: #4a5365;
      }
      .arcade-result-debug dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 8px;
      }
      .arcade-result-debug code {
        word-break: break-all;
        color: #4a5365;
      }

      /* ── Replay viewer (dev only) ──────────────────────────────────────── */
      .arcade-replay-form {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        max-width: 600px;
        margin: 0 auto;
        width: 100%;
      }
      .arcade-replay-form h1 {
        margin: 0;
        font-size: 24px;
        color: #7cf6a4;
      }
      .arcade-dev-badge {
        font-size: 11px;
        background: #2a2a3a;
        color: #ffd866;
        padding: 2px 6px;
        border-radius: 4px;
        vertical-align: middle;
      }
      .arcade-replay-form label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        width: 100%;
        font-size: 13px;
        color: #8b95a5;
      }
      .arcade-replay-form input,
      .arcade-replay-form textarea {
        background: #14141f;
        color: #cfd6dd;
        border: 1px solid #2a2a3a;
        border-radius: 6px;
        padding: 8px;
        font-family: monospace;
        font-size: 13px;
      }
      .arcade-replay-form input:focus,
      .arcade-replay-form textarea:focus {
        border-color: #7cf6a4;
        outline: none;
      }
      .replay-form-actions {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 8px;
      }
      .replay-load {
        background: #7cf6a4;
        color: #0a0a0f;
        border: none;
        border-radius: 8px;
        padding: 8px 20px;
        font-family: inherit;
        font-weight: bold;
        cursor: pointer;
      }
      .replay-back-link {
        color: #8b95a5;
        text-decoration: none;
        font-size: 13px;
      }
      .replay-back-link:hover { color: #7cf6a4; }
      .replay-error {
        color: #ff6b6b;
        font-size: 13px;
      }
      .arcade-replay-shell {
        flex: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .arcade-replay-controls {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 10px;
        background: #0d0d16;
        border-bottom: 1px solid #2a2a3a;
        font-size: 13px;
      }
      .replay-toggle, .replay-step {
        background: #14141f;
        color: #cfd6dd;
        border: 1px solid #2a2a3a;
        border-radius: 6px;
        padding: 4px 10px;
        font-family: inherit;
        cursor: pointer;
      }
      .replay-toggle:hover, .replay-step:hover { border-color: #7cf6a4; }
      .replay-speeds {
        display: flex;
        gap: 4px;
      }
      .replay-speed {
        background: #14141f;
        color: #8b95a5;
        border: 1px solid #2a2a3a;
        border-radius: 4px;
        padding: 3px 8px;
        font-family: inherit;
        cursor: pointer;
        font-size: 12px;
      }
      .replay-speed.active {
        background: #1a2a1f;
        color: #7cf6a4;
        border-color: #2a4a3a;
      }
      .replay-frame-counter {
        margin-left: auto;
        color: #8b95a5;
        font-size: 12px;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
