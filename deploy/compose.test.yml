services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: arcade
      POSTGRES_PASSWORD: arcade-test
      POSTGRES_DB: arcade_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcade -d arcade_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
